name: Lint Code

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  lint:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Install clang-format
      run: |
        sudo apt update
        sudo apt install -y clang-format
        
    - name: List C++ files
      run: |
        find . -name "*.cpp" -o -name "*.h" -o -name "*.hpp" | while read file; do
          echo "📄 $file"
        done
        
    - name: Check formatting (non-fatal)
      run: |
        if find . -name "*.cpp" -o -name "*.h" -o -name "*.hpp" | grep -q .; then
          find . -name "*.cpp" -o -name "*.h" -o -name "*.hpp" | xargs clang-format -n --verbose || echo "Formatting issues found (but not failing workflow)"
        else
          echo "No C++ files to check"
        fi
        
    - name: Show what would change
      run: |
        if find . -name "*.cpp" -o -name "*.h" -o -name "*.hpp" | grep -q .; then
          find . -name "*.cpp" -o -name "*.h" -o -name "*.hpp" | xargs clang-format -i
          git diff --color || echo "No differences found"
          # Revert the changes so we don't modify the repo
          git checkout -- .
        else
          echo "No C++ files found"
        fi
